<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Browser Controller</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #browser-view {
            border: 2px solid #333;
            border-radius: 8px;
            width: 1280px;
            height: 720px;
            background: #000;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .controls,
        .model-selector,
        .api-key-section {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        #logs {
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
            height: 150px;
            overflow-y: auto;
            background: #222;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #333;
        }

        .log-entry {
            margin-bottom: 5px;
            color: #aaa;
        }

        .log-plan {
            color: #4caf50;
        }

        .log-error {
            color: #f44336;
        }

        .status {
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }

        .model-selector label,
        .api-key-section label {
            color: #aaa;
            min-width: 100px;
        }

        select {
            padding: 8px 12px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        select:hover {
            border-color: #007bff;
        }

        #api-status {
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            background: #333;
        }

        #save-api-btn {
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>🤖 AI Browser Controller</h1>

    <img id="browser-view" src="" alt="Waiting for stream..." />

    <div class="status" id="status">Connecting...</div>

    <div class="api-key-section">
        <label for="api-key-input">🔑 Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="AIza..." />
        <button id="save-api-btn">Save</button>
        <span id="api-status">❌ Not configured</span>
    </div>

    <div class="model-selector">
        <label for="model-select">AI Model:</label>
        <select id="model-select">
            <option value="flash-latest">Gemini Flash (Recommended)</option>
            <option value="flash-2.5">Gemini 2.5 Flash</option>
            <option value="pro-latest">Gemini Pro (Slower, Smarter)</option>
            <option value="flash-lite">Gemini Flash Lite (Faster)</option>
        </select>
    </div>

    <div class="controls">
        <input type="text" id="command-input" placeholder="Type a command (e.g., 'Search for Hello World')..." />
        <button id="send-btn">Execute</button>
    </div>

    <div id="logs"></div>

    <script>
        const ws = new WebSocket('ws://localhost:3000');
        const img = document.getElementById('browser-view');
        const logs = document.getElementById('logs');
        const status = document.getElementById('status');
        const input = document.getElementById('command-input');
        const btn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveApiBtn = document.getElementById('save-api-btn');
        const apiStatus = document.getElementById('api-status');

        function addLog(text, type = 'normal') {
            const div = document.createElement('div');
            div.className = 'log-entry ' + (type === 'plan' ? 'log-plan' : type === 'error' ? 'log-error' : '');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        ws.onopen = () => {
            status.textContent = 'Connected to AI Backend';
            addLog('WebSocket connected');
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'screenshot') {
                img.src = 'data:image/jpeg;base64,' + msg.data;
            } else if (msg.type === 'log') {
                addLog(msg.message, 'plan');
            } else if (msg.type === 'status') {
                status.textContent = msg.message;
            } else if (msg.type === 'error') {
                addLog(msg.message, 'error');
            } else if (msg.type === 'model_info') {
                modelSelect.value = msg.current;
                addLog(`Available models: ${msg.available.join(', ')}`);
                if (msg.hasApiKey) {
                    apiStatus.textContent = '✅ Configured';
                    apiStatus.style.background = '#1a4d2e';
                } else {
                    apiStatus.textContent = '❌ Not configured';
                    apiStatus.style.background = '#4d1a1a';
                }
            } else if (msg.type === 'model_changed') {
                if (msg.success) {
                    addLog(`✅ Model changed to: ${msg.model}`, 'plan');
                    status.textContent = `Using: ${msg.model}`;
                } else {
                    addLog(`❌ Failed to change model: ${msg.error}`, 'error');
                }
            } else if (msg.type === 'api_key_updated') {
                if (msg.success) {
                    addLog(`✅ API key updated successfully!`, 'plan');
                    apiStatus.textContent = '✅ Configured';
                    apiStatus.style.background = '#1a4d2e';
                    apiKeyInput.value = '';
                } else {
                    addLog(`❌ Failed to update API key: ${msg.error}`, 'error');
                }
            }
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected';
            addLog('WebSocket disconnected', 'error');
        };

        function sendCommand() {
            const text = input.value.trim();
            if (!text) return;

            addLog(`User: ${text}`);
            ws.send(JSON.stringify({ type: 'command', text: text }));
            input.value = '';
        }

        btn.onclick = sendCommand;
        input.onkeypress = (e) => {
            if (e.key === 'Enter') sendCommand();
        };

        modelSelect.onchange = () => {
            const selectedModel = modelSelect.value;
            addLog(`Changing model to: ${selectedModel}...`);
            ws.send(JSON.stringify({ type: 'change_model', model: selectedModel }));
        };

        saveApiBtn.onclick = () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                addLog('❌ Please enter an API key', 'error');
                return;
            }
            addLog('Updating API key...');
            ws.send(JSON.stringify({ type: 'update_api_key', apiKey: apiKey }));
        };
    </script>
</body>

</html>
